name: Test invalid path with tilde is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: latest
          # Tilde should be rejected by the action's path validation
          path: '~/my-bins'
          cache: 'false'
      - name: Assert action failed due to tilde in path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected path containing tilde"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected path containing tilde but it succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
