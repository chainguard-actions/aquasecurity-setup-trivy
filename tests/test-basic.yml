name: Test basic usage - install latest Trivy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: latest
          cache: 'false'
      - name: Assert Trivy is installed and on PATH (or action failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking trivy is available..."
            if ! command -v trivy >/dev/null 2>&1; then
              echo "FAIL: trivy not found on PATH after successful action"
              exit 1
            fi
            TRIVY_VERSION_OUTPUT=$(trivy --version 2>&1 || true)
            echo "trivy version output: $TRIVY_VERSION_OUTPUT"
            if [ -z "$TRIVY_VERSION_OUTPUT" ]; then
              echo "FAIL: trivy --version returned empty output"
              exit 1
            fi
            echo "PASS: trivy is installed and accessible"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/checkout issue under act is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
