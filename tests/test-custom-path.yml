name: Test custom installation path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: latest
          path: './my-bins'
          cache: 'false'
      - name: Assert Trivy is installed in custom path (or action failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking trivy binary exists in custom path..."
            CUSTOM_BIN_DIR="./my-bins/trivy-bin"
            if [ ! -f "${CUSTOM_BIN_DIR}/trivy" ]; then
              echo "FAIL: trivy binary not found at ${CUSTOM_BIN_DIR}/trivy"
              ls -la ./my-bins/ 2>/dev/null || echo "(my-bins dir not found)"
              exit 1
            fi
            echo "PASS: trivy binary found at ${CUSTOM_BIN_DIR}/trivy"
            if ! command -v trivy >/dev/null 2>&1; then
              echo "FAIL: trivy not found on PATH after custom path install"
              exit 1
            fi
            TRIVY_VERSION_OUTPUT=$(trivy --version 2>&1 || true)
            echo "trivy version output: $TRIVY_VERSION_OUTPUT"
            if [ -z "$TRIVY_VERSION_OUTPUT" ]; then
              echo "FAIL: trivy --version returned empty output"
              exit 1
            fi
            echo "PASS: trivy is accessible from PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/checkout issue under act is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
