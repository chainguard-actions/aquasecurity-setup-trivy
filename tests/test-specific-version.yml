name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: 'v0.50.0'
          cache: 'false'
        continue-on-error: true

      - name: Assert specific version installed or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking trivy version..."
            echo "PATH: $PATH"
            if ! command -v trivy >/dev/null 2>&1; then
              echo "FAIL: trivy not found on PATH after successful install"
              exit 1
            fi
            echo "trivy found at: $(command -v trivy)"
            OUTPUT=$(trivy --version 2>&1 || true)
            echo "trivy --version output: $OUTPUT"
            if ! echo "$OUTPUT" | grep -q "0.50.0"; then
              echo "FAIL: expected version 0.50.0 but got: $OUTPUT"
              exit 1
            fi
            echo "PASS: trivy version 0.50.0 confirmed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely network/download issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
