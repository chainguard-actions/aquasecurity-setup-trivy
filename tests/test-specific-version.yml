name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'v0.58.2'
          cache: 'false'
      - name: Assert Trivy specific version is installed (or action failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking trivy is available..."
            if ! command -v trivy >/dev/null 2>&1; then
              echo "FAIL: trivy not found on PATH"
              exit 1
            fi
            TRIVY_VERSION_OUTPUT=$(trivy --version 2>&1 || true)
            echo "trivy version output: $TRIVY_VERSION_OUTPUT"
            if echo "$TRIVY_VERSION_OUTPUT" | grep -q "0.58.2"; then
              echo "PASS: trivy version 0.58.2 is installed"
            else
              echo "FAIL: expected version 0.58.2 but got: $TRIVY_VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/checkout issue under act is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
